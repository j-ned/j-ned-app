name: Web CI

# Construire, tester, juger la sortie Vercel (`scripts/build-vercel.mjs`) rejouée en local devant la
# doublure de l'API : c'est elle que Vercel déploie depuis Git (ADR-0036). En parallèle, l'image du
# conteneur (nginx devant Node, ADR-0038) est construite et jugée par le même smoke test ; sur master,
# elle est publiée sur GHCR. Rien n'est déployé ici.
on:
  pull_request:
    paths:
      - apps/web/**
      - "!apps/web/specs/**"
      - "!apps/web/tasks/**"
      - "!apps/web/docs/**"
      - "!apps/web/**/*.md"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/web-ci.yml
  push:
    branches: [master]
    paths:
      - apps/web/**
      - "!apps/web/specs/**"
      - "!apps/web/tasks/**"
      - "!apps/web/docs/**"
      - "!apps/web/**/*.md"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/web-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # pnpm avant setup-node : la version vient du champ `packageManager` de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Même commande que Vercel : un lockfile incohérent échoue ici, pas au déploiement.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @portfolio/web

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm run format:check

      - name: Icons
        run: pnpm icons:check

      - name: Typecheck e2e
        run: pnpm a11y:typecheck

      - name: Test
        run: pnpm test

      # Même build que Vercel (`vercel.json`), sortie `.vercel/output` comprise.
      - name: Build (production + Vercel output)
        run: pnpm run build --configuration production && node scripts/build-vercel.mjs

      - name: Verify prerender
        run: ci/verify-prerender.sh dist/angular-portfolio-app/browser dist/angular-portfolio-app/server

      - name: Start local stack (Vercel output + API stub)
        run: ci/local-stack.sh up

      - name: Smoke test
        run: ci/smoke.sh

      - name: Stack logs
        if: failure()
        run: cat "$RUNNER_TEMP"/portfolio-local-stack/*.log || true

      - name: Stop local stack
        if: always()
        run: ci/local-stack.sh down

  image:
    name: Image · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: j-ned-app-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start image stack (image + API stub)
        working-directory: apps/web
        run: ci/image-stack.sh up j-ned-app-web:ci

      - name: Smoke test the image
        working-directory: apps/web
        env:
          SMOKE_TARGET: image
        run: ci/smoke.sh

      - name: Stack logs
        if: failure()
        run: docker logs portfolio-image || true

      - name: Stop image stack
        if: always()
        working-directory: apps/web
        run: ci/image-stack.sh down

  # Seule une image dont le code a passé les tests et dont le conteneur a été jugé est publiée. Même
  # Dockerfile et même cache que le job `image` : toutes les couches viennent du cache.
  publish:
    name: Publication GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [ci, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/j-ned-app-web:latest
            ghcr.io/${{ github.repository_owner }}/j-ned-app-web:sha-${{ github.sha }}
          # Relie le paquet GHCR à ce dépôt (page et visibilité du paquet).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
