name: Web CI

# Lint, tests et build de production d'un côté ; de l'autre, l'image du conteneur (nginx devant Node,
# ADR-0038) construite et jugée par le smoke test devant la doublure de l'API. Sur master, l'image
# jugée est publiée sur GHCR ; le workflow `Deploy` demande ensuite à Dokploy de la tirer.
on:
  pull_request:
    paths:
      - apps/web/**
      - "!apps/web/specs/**"
      - "!apps/web/tasks/**"
      - "!apps/web/docs/**"
      - "!apps/web/**/*.md"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/web-ci.yml
  push:
    branches: [master]
    paths:
      - apps/web/**
      - "!apps/web/specs/**"
      - "!apps/web/tasks/**"
      - "!apps/web/docs/**"
      - "!apps/web/**/*.md"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/web-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR. Sur une PR, le nouveau push annule le précédent. Sur master, le run en cours
# va au bout : son image `sha-<commit>` est une cible de retour arrière, et les runs restent dans
# l'ordre des fusions pour que `latest` ne recule pas. GitHub ne garde qu'un run en attente par
# groupe : lors d'une rafale de trois fusions, celle du milieu n'est pas construite.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm avant setup-node : la version vient du champ `packageManager` de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Même commande que le Dockerfile : un lockfile incohérent échoue ici aussi.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @portfolio/web

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm run format:check

      - name: Icons
        run: pnpm icons:check

      - name: Typecheck e2e
        run: pnpm a11y:typecheck

      - name: Test
        run: pnpm test

      - name: Build (production)
        run: pnpm run build --configuration production

      - name: Verify prerender
        run: ci/verify-prerender.sh dist/angular-portfolio-app/browser dist/angular-portfolio-app/server

  image:
    name: Image · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: j-ned-app-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start image stack (image + API stub)
        working-directory: apps/web
        run: ci/image-stack.sh up j-ned-app-web:ci

      - name: Smoke test the image
        working-directory: apps/web
        run: ci/smoke.sh

      - name: Stack logs
        if: failure()
        run: docker logs portfolio-image || true

      - name: Stop image stack
        if: always()
        working-directory: apps/web
        run: ci/image-stack.sh down

  # Seule une image dont le code a passé les tests et dont le conteneur a été jugé est publiée. Même
  # Dockerfile et même cache que le job `image` : toutes les couches viennent du cache.
  publish:
    name: Publication GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [ci, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/j-ned-app-web:latest
            ghcr.io/${{ github.repository_owner }}/j-ned-app-web:sha-${{ github.sha }}
          # Relie le paquet GHCR à ce dépôt (page et visibilité du paquet).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
