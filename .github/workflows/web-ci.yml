name: Web CI

# Construire, tester, juger la sortie Vercel (`scripts/build-vercel.mjs`) rejouée en local devant la
# doublure de l'API. Le déploiement est celui de Vercel depuis Git (ADR-0036) : rien n'est publié ici.
on:
  pull_request:
    paths:
      - apps/web/**
      - "!apps/web/specs/**"
      - "!apps/web/tasks/**"
      - "!apps/web/docs/**"
      - "!apps/web/**/*.md"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/web-ci.yml
  push:
    branches: [master]
    paths:
      - apps/web/**
      - "!apps/web/specs/**"
      - "!apps/web/tasks/**"
      - "!apps/web/docs/**"
      - "!apps/web/**/*.md"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/web-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # pnpm avant setup-node : la version vient du champ `packageManager` de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Même commande que Vercel : un lockfile incohérent échoue ici, pas au déploiement.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @portfolio/web

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm run format:check

      - name: Icons
        run: pnpm icons:check

      - name: Typecheck e2e
        run: pnpm a11y:typecheck

      - name: Test
        run: pnpm test

      # Même build que Vercel (`vercel.json`), sortie `.vercel/output` comprise.
      - name: Build (production + Vercel output)
        run: pnpm run build --configuration production && node scripts/build-vercel.mjs

      - name: Verify prerender
        run: ci/verify-prerender.sh dist/angular-portfolio-app/browser dist/angular-portfolio-app/server

      - name: Start local stack (Vercel output + API stub)
        run: ci/local-stack.sh up

      - name: Smoke test
        run: ci/smoke.sh

      - name: Stack logs
        if: failure()
        run: cat "$RUNNER_TEMP"/portfolio-local-stack/*.log || true

      - name: Stop local stack
        if: always()
        run: ci/local-stack.sh down
