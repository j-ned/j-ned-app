name: Web CI

# Construire, tester, juger le build servi (Dockerfile comme harnais de test). Le déploiement est
# celui de Vercel depuis Git (ADR-0036) : rien n'est publié ici. Le run sur master écrit le cache
# Docker que les PR lisent (GitHub cloisonne le cache entre PR).
on:
  pull_request:
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - docker-bake.hcl
      - .github/workflows/web-ci.yml
  push:
    branches: [master]
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - docker-bake.hcl
      - .github/workflows/web-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Runner jetable : pas de nettoyage du builder en fin de job.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      # Un seul passage BuildKit : étage `test` (lint, format, icônes, typage e2e, Vitest) et image
      # de production, en parallèle sur les mêmes sources installées, avec le cache GHA.
      - name: Build and test (Dockerfile)
        uses: docker/bake-action@v6
        with:
          source: .
          targets: web-ci
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Les garanties du build de production, jugées sur les fichiers que l'image sert.
      - name: Verify served build
        run: |
          set -euo pipefail
          id=$(docker create ng-portfolio-app:ci)
          docker cp -q "$id:/usr/share/nginx/html" /tmp/browser
          docker cp -q "$id:/app/server" /tmp/server
          docker rm -f "$id" > /dev/null
          apps/web/ci/verify-prerender.sh /tmp/browser /tmp/server

      - name: Smoke test the image
        working-directory: apps/web
        run: ci/smoke.sh ng-portfolio-app:ci
