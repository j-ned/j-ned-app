name: Backup CI

# Image de sauvegarde de la base (`deploy/backup`, ADR-0038) : construite, puis jugée de bout en bout
# devant un Postgres et un stockage S3 jetables (sauvegarde chiffrée, restauration identique, refus
# d'une mauvaise phrase). Sur master, l'image jugée est publiée sur GHCR.
on:
  pull_request:
    paths:
      - deploy/backup/**
      - .github/workflows/backup-ci.yml
  push:
    branches: [master]
    paths:
      - deploy/backup/**
      - .github/workflows/backup-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: backup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image · Sauvegarde · Restauration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/backup
          push: false
          load: true
          tags: j-ned-app-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Back up and restore
        run: deploy/backup/check.sh j-ned-app-backup:ci

  # Même Dockerfile et même cache que le job `image` : toutes les couches viennent du cache.
  publish:
    name: Publication GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/backup
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/j-ned-app-backup:latest
            ghcr.io/${{ github.repository_owner }}/j-ned-app-backup:sha-${{ github.sha }}
          # Relie le paquet GHCR à ce dépôt (page et visibilité du paquet).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backup
