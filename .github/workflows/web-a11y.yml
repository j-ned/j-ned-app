name: Web · Accessibilité

# Audit axe hors des pull requests : chaque lundi sur master, et à la demande (bouton « Run
# workflow »). En local avant une PR qui touche l'interface : voir CLAUDE.md, « Audit axe ».
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: Axe (WCAG 2.0/2.1/2.2 A et AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @portfolio/web

      # Chromium à la version du paquet, avec ses bibliothèques système.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # L'image que la production fait tourner, construite depuis la racine du monorepo.
      - name: Build image
        working-directory: .
        run: docker build -f apps/web/Dockerfile -t j-ned-app-web:ci .

      - name: Start image stack (image + API stub)
        run: ci/image-stack.sh up j-ned-app-web:ci

      - name: Audit axe
        run: pnpm a11y

      - name: Stack logs
        if: failure()
        run: docker logs portfolio-image || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a11y-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

      - name: Stop image stack
        if: always()
        run: ci/image-stack.sh down
