name: Web · Accessibilité

# Audit axe hors des pull requests : chaque lundi sur master, et à la demande (bouton « Run
# workflow »). En local avant une PR qui touche l'interface : voir CLAUDE.md, « Audit axe ».
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: Axe (WCAG 2.0/2.1/2.2 A et AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @portfolio/web

      # Chromium à la version du paquet, avec ses bibliothèques système.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build (production + Vercel output)
        run: pnpm run build --configuration production && node scripts/build-vercel.mjs

      - name: Start local stack (Vercel output + API stub)
        run: ci/local-stack.sh up

      - name: Audit axe
        run: pnpm a11y

      - name: Stack logs
        if: failure()
        run: cat "$RUNNER_TEMP"/portfolio-local-stack/*.log || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

      - name: Stop local stack
        if: always()
        run: ci/local-stack.sh down
