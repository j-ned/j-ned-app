name: API CI

# Sur une PR : lint, types, tests sur Postgres, build, puis l'API construite, lancée par Node en mode
# production, passe la suite de parité HTTP (packages/api-parity). Le déploiement est celui de Vercel
# depuis Git (ADR-0036). En parallèle, l'image du conteneur (ADR-0038) est construite, ses migrations
# jouées sur un Postgres jetable et sa sonde interrogée ; sur master, elle est publiée sur GHCR. Rien
# n'est déployé ici.
on:
  pull_request:
    paths:
      - apps/api/**
      - packages/api-parity/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/api-ci.yml
  push:
    branches: [master]
    paths:
      - apps/api/**
      - packages/api-parity/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .npmrc
      - .nvmrc
      - .github/workflows/api-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Parité HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Même image que le README et compose.yaml. Les tests d'intégration appliquent eux-mêmes les
    # migrations Drizzle sur une base jetable dédiée.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      PROFILE_IT_DATABASE_URL: postgres://postgres:it@127.0.0.1:5432/profile_it
      DEMO_IT_DATABASE_URL: postgres://postgres:it@127.0.0.1:5432/demo_it

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # pnpm avant setup-node : la version vient du champ `packageManager` de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Même commande que Vercel pour l'API, plus la suite de parité.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @portfolio/api --filter @portfolio/api-parity

      # `pnpm lint` corrige (--fix) : en CI on vérifie seulement.
      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      # Jest (ts-jest) ne vérifie pas les types des specs : tsc couvre code et tests.
      - name: Typecheck
        run: pnpm typecheck

      - name: Create integration databases
        run: psql "postgres://postgres:it@127.0.0.1:5432/postgres" -c "CREATE DATABASE profile_it" -c "CREATE DATABASE demo_it"

      # Unitaires et intégration ensemble : sans les variables *_IT_DATABASE_URL, les suites
      # d'intégration seraient ignorées (describe.skip) et le job resterait vert sans les jouer.
      - name: Test (unit + integration on Postgres)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Typecheck · Format parity suite
        run: |
          pnpm --filter @portfolio/api-parity typecheck
          pnpm --filter @portfolio/api-parity format:check

      # La suite vise l'API construite (mode production, migrations appliquées sur une base vide),
      # pas les sources : c'est le contrat HTTP que l'API tient.
      - name: Start parity stack (built API + Postgres)
        run: |
          psql "postgres://postgres:it@127.0.0.1:5432/postgres" -c "CREATE DATABASE parity"
          PARITY_DATABASE_URL=postgres://postgres:it@127.0.0.1:5432/parity ../../packages/api-parity/scripts/stack.sh up

      - name: Parity suite
        run: pnpm --filter @portfolio/api-parity test

      - name: API logs
        if: failure()
        run: cat ../../packages/api-parity/.parity-api.log || true

      - name: Stop parity stack
        if: always()
        run: ../../packages/api-parity/scripts/stack.sh down

  # Base des previews Vercel = branche Neon `preview` (schéma + seed de démo, jamais de copie de prod,
  # docs/preview-env.md). Les migrations de la PR y sont appliquées une fois validées par le job
  # verify sur Postgres jetable. Sans le secret (forks, Dependabot, secret pas encore créé), le job ne
  # fait rien.
  preview-db:
    name: Preview · Migrations Neon
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Une seule migration à la fois sur la base partagée, sans en interrompre une en cours.
    concurrency:
      group: preview-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Secret absent, migrations de preview ignorées
        if: env.DATABASE_URL == ''
        working-directory: .
        run: echo "::notice::PREVIEW_DATABASE_URL_UNPOOLED absent, migrations de preview ignorées"

      - name: Checkout
        if: env.DATABASE_URL != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        if: env.DATABASE_URL != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        if: env.DATABASE_URL != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile --filter @portfolio/api

      - name: Migrations (branche Neon preview)
        if: env.DATABASE_URL != ''
        run: pnpm db:migrate

  image:
    name: Image · Migrations · Santé
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: j-ned-app-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Le conteneur tel qu'il tournera : production déclarée, migrations par l'image elle-même (deux
      # fois : elles se rejouent sans effet), puis la sonde qui interroge la base.
      - name: Migrate and probe the image
        run: apps/api/ci/image-check.sh j-ned-app-api:ci

  # Seule une image dont le code a passé les tests et dont le conteneur a été jugé est publiée. Même
  # Dockerfile et même cache que le job `image` : toutes les couches viennent du cache.
  publish:
    name: Publication GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/j-ned-app-api:latest
            ghcr.io/${{ github.repository_owner }}/j-ned-app-api:sha-${{ github.sha }}
          # Relie le paquet GHCR à ce dépôt (page et visibilité du paquet).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
