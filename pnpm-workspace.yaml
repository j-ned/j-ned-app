packages:
  - apps/*
  - packages/*

# Paquets autorisés à lancer leurs scripts d'installation : esbuild (Angular), argon2 (API).
onlyBuiltDependencies:
  - argon2
  - esbuild

# Correctifs de sécurité des dépendances transitives, repris des deux dépôts d'origine : ils
# s'appliquent désormais à tout le workspace.
overrides:
  # web
  "@tailwindcss/typography>postcss-selector-parser": ^7.1.6
  source-map-js@<1.2.2: ^1.2.2
  beasties@<0.5.5: 0.5.5
  dompurify@<3.4.17: ^3.4.17
  undici@>=8.0.0 <8.12.2: ^8.12.2
  # api
  js-yaml: ">=4.3.1"
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  handlebars@<4.7.10: ^4.7.10
  fast-uri@<3.1.9: ^3.1.9
