# Pile de production du portfolio sur le serveur, déployée par Dokploy (service de type Compose,
# ADR-0038). Dokploy lit ce fichier dans le dépôt (branche master) à chaque déploiement et ne
# construit rien : il tire les images publiées sur GHCR par la CI.
#
# - Aucun port publié : le trafic arrive par le tunnel Cloudflare, puis le Traefik de Dokploy, qui
#   joint `portfolio-web` par `dokploy-network`. Le domaine se règle dans l'onglet Domains de Dokploy
#   (service `portfolio-web`, port 3000), qui ajoute les labels Traefik.
# - Variables : onglet Environment de Dokploy, écrit dans le `.env` voisin (modèle :
#   `portfolio.env.example`). Chaque service ne reçoit que les siennes.
# - Noms de service préfixés : `dokploy-network` est partagé avec les autres piles du serveur, où un
#   nom comme `api` ou `postgres` pourrait désigner le conteneur d'un autre projet.
# - Retour à une version : fixer `WEB_IMAGE` / `API_IMAGE` sur un tag `sha-<commit>` et redéployer.
# - Durcissement : chaque service tourne sur un système de fichiers en lecture seule, sans capacité
#   Linux ni élévation de privilège, sous un utilisateur sans privilège, avec une mémoire et un nombre
#   de processus bornés. Les exceptions sont motivées sur place ; `compose.check.sh` affirme
#   l'ensemble avant chaque déploiement (détail : README, « Durcissement de la pile »).
# - Réseaux : la base n'est que sur `portfolio-db`, réseau interne (sans sortie) partagé avec l'API,
#   les migrations et la sauvegarde. Ni le site ni le cron ne peuvent l'atteindre.

name: portfolio

# Socle commun. `mem_limit` et `pids_limit` sont les clés lues par `docker compose up`, la commande
# de Dokploy pour un service Compose (`deploy.resources` vise Swarm).
x-durci: &durci
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  portfolio-web:
    image: ${WEB_IMAGE:-ghcr.io/j-ned/j-ned-app-web:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    <<: *durci
    # Le script de démarrage reste root pour lancer Node sous `ssr` et nginx sous `nginx`, puis les
    # surveiller : SETUID/SETGID pour changer d'utilisateur, KILL pour signaler ces processus d'un
    # autre utilisateur, CHOWN pour remettre les dossiers de cache à `nginx`. Le port 3000 n'exige
    # pas NET_BIND_SERVICE.
    cap_add: [CHOWN, KILL, SETGID, SETUID]
    mem_limit: 512m
    pids_limit: 256
    environment:
      API_UPSTREAM: http://portfolio-api:3000
      SSR_FORWARD_SECRET: ${SSR_FORWARD_SECRET:?}
    # Configuration générée au démarrage depuis le gabarit (envsubst) et fichier pid de nginx.
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /run:size=1m
    # Cache des images (1 Go au plus) et du rendu, tampons de nginx : sur disque, un tmpfs les
    # compterait dans la mémoire du conteneur.
    volumes:
      - portfolio-web-cache:/var/cache/nginx
    networks:
      - default
      - dokploy-network

  portfolio-api:
    image: ${API_IMAGE:-ghcr.io/j-ned/j-ned-app-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      portfolio-db:
        condition: service_healthy
      portfolio-migrate:
        condition: service_completed_successfully
    <<: *durci
    user: node
    mem_limit: 768m
    pids_limit: 256
    # libvips (sharp) y dépose ses fichiers temporaires pour les grandes images.
    tmpfs:
      - /tmp:size=64m
    networks:
      - default
      - portfolio-db
    environment:
      - APP_ENV=production
      # Rôle applicatif (lecture et écriture des lignes, aucun droit sur le schéma) dès que
      # POSTGRES_APP_USER et POSTGRES_APP_PASSWORD sont renseignées ensemble ; sinon le rôle
      # propriétaire, le temps de créer le rôle (`postgres/README.md`).
      - DATABASE_URL=postgres://${POSTGRES_APP_USER:-${POSTGRES_USER:?}}:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?}}@portfolio-db:5432/${POSTGRES_DB:?}
      - JWT_SECRET=${JWT_SECRET:?}
      - CORS_ORIGINS=${CORS_ORIGINS:?}
      - CRON_SECRET=${CRON_SECRET:?}
      - SSR_FORWARD_SECRET=${SSR_FORWARD_SECRET:?}
      - S3_ENDPOINT=${S3_ENDPOINT:?}
      - S3_REGION=${S3_REGION:?}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
      - RESEND_API_KEY=${RESEND_API_KEY:?}
      - MAIL_FROM=${MAIL_FROM:?}
      # Facultatives : transmises seulement si elles sont définies (une valeur vide serait refusée
      # par l'API au démarrage).
      - JWT_EXPIRES_IN
      - TOTP_APP_NAME
      - SENTRY_DSN
      - SENTRY_FRONTEND_DSN
      - SENTRY_TRACES_SAMPLE_RATE

  # Migrations appliquées par l'image de l'API avant chaque démarrage de l'API : le conteneur sort,
  # et l'API n'est remplacée que s'il a réussi.
  portfolio-migrate:
    image: ${API_IMAGE:-ghcr.io/j-ned/j-ned-app-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: "no"
    command: ["node", "dist/database/scripts/migrate.js"]
    depends_on:
      portfolio-db:
        condition: service_healthy
    <<: *durci
    user: node
    mem_limit: 256m
    pids_limit: 64
    networks:
      - portfolio-db
    # Rôle propriétaire du schéma : le seul à pouvoir le modifier.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@portfolio-db:5432/${POSTGRES_DB:?}

  # Tâches quotidiennes de l'API (agrégat de la mesure d'audience), à minuit UTC. Un échec est
  # journalisé et la boucle continue : l'agrégat du lendemain rattrape les jours manqués.
  portfolio-cron:
    image: ${API_IMAGE:-ghcr.io/j-ned/j-ned-app-api:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      - portfolio-api
    <<: *durci
    user: node
    mem_limit: 32m
    pids_limit: 16
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while :; do
          sleep "$$(( 86400 - $$(date -u +%s) % 86400 ))"
          if wget -q -O /dev/null --header "Authorization: Bearer $$CRON_SECRET" http://portfolio-api:3000/api/cron/daily; then
            echo "$$(date -u +%FT%TZ) cron quotidien : ok"
          else
            echo "$$(date -u +%FT%TZ) cron quotidien : échec" >&2
          fi
        done

  portfolio-db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *durci
    # Démarrage direct sous `postgres` (uid 70, déjà propriétaire du volume) : sans passage par root,
    # l'image n'a besoin d'aucune capacité.
    user: postgres
    mem_limit: 1g
    pids_limit: 256
    # Socket et fichier de verrou du serveur.
    tmpfs:
      - /run/postgresql:size=1m
    networks:
      - portfolio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Sauvegarde quotidienne chiffrée de la base vers un bucket hors du serveur (`backup/backup.sh`).
  portfolio-backup:
    image: ${BACKUP_IMAGE:-ghcr.io/j-ned/j-ned-app-backup:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      portfolio-db:
        condition: service_healthy
    <<: *durci
    user: postgres
    mem_limit: 256m
    pids_limit: 64
    # Dossier de travail du script (dump en clair, puis chiffré, effacés après l'envoi) : sur disque,
    # un tmpfs compterait la taille de la base dans la mémoire du conteneur.
    volumes:
      - portfolio-backup-work:/tmp
    # `default` pour sortir vers le bucket, `portfolio-db` pour joindre la base.
    networks:
      - default
      - portfolio-db
    environment:
      PGHOST: portfolio-db
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}

volumes:
  portfolio-db-data:
  portfolio-web-cache:
  portfolio-backup-work:

networks:
  dokploy-network:
    external: true
  # Sans passerelle : rien n'y entre ni n'en sort, la base ne parle qu'aux services qui y sont joints.
  portfolio-db:
    internal: true
